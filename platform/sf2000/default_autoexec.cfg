// EDuke32 controls for the Data Frog SF2000 / GB300 pad.
//
// eduke32 executes this file at startup (it looks for autoexec.cfg in the game
// directory). The port writes it on first boot; edit it freely after that -- it
// is read on every start, and everything in it can also be changed from the
// game's own setup menu.
//
// The pad only has a D-pad and eight buttons, so it sends plain keyboard keys
// (see platform/sf2000/sf2000_input.c). This file is what turns those keys into
// game actions, which is why rebinding here works with no code change: rebind
// "fire" to anything and the pad's A button follows.

unbindall

// Movement. Up/Down double as the menus' navigation keys, so they cannot be
// anything else in-game.
bind Up           Move_Forward
bind Down         Move_Backward

// Left/Right turn, with the pad's built-in ramp: a tap is a precise nudge, a
// hold sweeps. Only one of the two is bound, because the engine's Turn_Left and
// Turn_Right are symmetric and both come from the same D-pad axis.
bind Left          Turn_Left
bind Right         Turn_Right

// Fire is Space. Enter is deliberately left unbound: the pad sends it as well so
// that A doubles as "accept" in menus, and binding it here would open the
// inventory every time the player fired.
bind Space         Fire

// Jump and use. LShift is Run upstream, and on a pad there is no reason to have
// both, so LShift becomes Jump and the shoulder/trigger role goes to the D-pad.
bind LShift        Jump
bind E             Open

// Strafing. Upstream binds LCtrl to Crouch, so the strafe modifier is put back
// where a keyboard player expects it; A and D are the strafe keys themselves.
bind A             Strafe_Left
bind D             Strafe_Right

// Inventory and the automap.
bind I             Inventory
bind Tab           Map

// Input. The console has no pointer: there is nothing for a mouse to point at,
// so switch the engine's mouse handling off rather than leaving it following a
// cursor that never moves. The D-pad does the looking instead.
in_mouse           0

// Pace the game to the logic rate rather than to the display, so a slow frame
// drops input instead of running the game fast.
r_maxfps           30